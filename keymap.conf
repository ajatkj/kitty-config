# Use same keymaps as in WezTerm
#
map ctrl+a send_key ctrl+a

# Focus windows
map alt+up neighboring_window up
map alt+down neighboring_window down
map alt+left neighboring_window left
map alt+right neighboring_window right

# Resize windows
map alt+shift+up kitten relative_resize.py up 5
map alt+shift+down kitten relative_resize.py down 5
map alt+shift+left kitten relative_resize.py left 5
map alt+shift+right kitten relative_resize.py right 5

# Move windows
map alt+ctrl+shift+up move_window up
map alt+ctrl+shift+down move_window down
map alt+ctrl+shift+left move_window left
map alt+ctrl+shift+right move_window right

# Create split windows
map super+shift+enter launch --location vsplit --cwd current
map super+enter launch --location hsplit --cwd current

# Navigate tabs
map super+right next_tab
map super+left previous_tab
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+8 goto_tab 8
map super+9 goto_tab 9

# Move tabs
map super+shift+left move_tab_backward
map super+shift+right move_tab_forward

map super+alt+f launch --type=overlay
map super+alt+g launch --type=background kitten quick-access-terminal --config ~/.config/kitty/kitty-quick-access-terminal.conf --instance-group @active-kitty-window-id
