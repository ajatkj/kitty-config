# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{

font_family      JetBrains Mono Regular
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 12.0
symbol_map U+2B00-U+2BFF JetBrainsMono Nerd Font
symbol_map U+F061,U+F063 JetBrainsMono Nerd Font
modify_font cell_height 115%

#: }}}

#: Cursor customization {{{

cursor_shape block
cursor_trail 0
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

#: }}}
#
# background_opacity 0.9
# background_blur 32
# dynamic_background_opacity yes

#: Scrollback {{{

scrollback_lines 200000
scrollback_pager nvim -c 'setlocal ft=man number modifiable noro relativenumber nolist showtabline=0 foldcolumn=0' -c "autocmd VimEnter * normal G" -c ":silent! %s#\($\n\s*\)\+\%$##" -
scrollbar always

#: }}}

#: Mouse {{{

copy_on_select clipboard

#: }}}

#: Terminal bell {{{

bell_on_tab " "
enable_audio_bell no

#: }}}

#: Window layout {{{

remember_window_size  yes
initial_window_width  100c
initial_window_height 50c
enabled_layouts splits
window_border_width 1pt
window_margin_width 0 0 0 1
window_padding_width 0 0 0 10
draw_minimal_borders yes
draw_window_borders_for_single_window yes
inactive_text_alpha 0.75
hide_window_decorations titlebar-only

#: }}}

#: Tab bar {{{

tab_bar_edge left
tab_bar_style separator
tab_bar_align start
tab_bar_min_tabs 1
tab_bar_margin_width 10.0
tab_bar_margin_height 10.0 0.0
tab_bar_show_new_tab_button yes
#: tab_fade is also used for defining "darken" factor in custom tab_bar
#tab_title_template "{fmt.noitalic}{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}󰘳 {index}:{title}{sup.num_windows}{keyboard_mode}\nAnkit Jain"
tab_title_template "{custom}"
tab_title_max_lines 3
# tab_title_wrap yes
# For horizontal tabs
# tab_bar_edge top
# tab_bar_style custom

#: }}}

#: Colorscheme {{{
# include Catppuccin-Macchiato.conf
include kanagawa.conf
#: }}}

#: Advanced {{{

editor nvim

#: }}}

#: OS specific tweaks {{{

macos_quit_when_last_window_closed yes
macos_show_window_title_in none
macos_option_as_alt yes

#: }}}

#: Keyboard shortcuts {{{

include keymap.conf

#: }}}

#: Shell Integration Options {{{

shell_integration no-title
#: Title update is handled by a zsh plugin
allow_remote_control yes
#: }}}


